x-seam-schema: v1
x-seam-owner: weather-service
x-api-version: v1
x-upstream: https://weather-api.internal.svc.cluster.local:443
x-vault-path: seam/routes/weather-service/api-key
x-inject-as:
  kind: header
  name: X-API-Key
x-credential-probe:
  path: /health
  method: GET
  interval: 10m

paths:
  /weather/forecast:
    get:
      operationId: getForecast
      summary: Get weather forecast
      tags:
        - Forecast
      parameters:
        - name: location
          in: query
          required: true
          schema:
            type: string
          description: Location identifier (e.g., "us-west-1")
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 14
            default: 7
          description: Number of days to forecast
      responses:
        "200":
          description: Successful forecast
          content:
            application/json:
              schema:
                type: object
                properties:
                  location:
                    type: string
                  days:
                    type: array
                    items:
                      type: object
        "400":
          description: Invalid request parameters
        "401":
          description: Invalid API key
        "429":
          description: Rate limit exceeded
