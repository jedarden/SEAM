x-seam-schema: v1
x-seam-owner: metrics-collector
x-api-version: v1
x-upstream: https://prometheus.ardenone.svc.cluster.local:9090
x-vault-path: seam/routes/metrics-collector/basic-auth
x-inject-as:
  kind: header
  name: Authorization
x-upstream-tls:
  caBundle: prometheus-ca
  serverName: prometheus.ardenone.svc
x-credential-probe:
  path: /api/v1/query
  method: POST
  interval: 3m
x-breaker:
  threshold: 5
  openSeconds: 60
  enabled: true

paths:
  /metrics/query:
    post:
      operationId: prometheusQuery
      summary: Execute Prometheus query
      tags:
        - Metrics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: PromQL query expression
                time:
                  type: string
                  format: date-time
                  description: Evaluation timestamp (RFC3339)
      responses:
        "200":
          description: Query result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
        "400":
          description: Bad request - invalid query
        "503":
          description: Service unavailable - circuit breaker open

  /metrics/query_range:
    post:
      operationId: prometheusQueryRange
      summary: Execute Prometheus range query
      tags:
        - Metrics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
                - start
                - end
                - step
              properties:
                query:
                  type: string
                start:
                  type: string
                  format: date-time
                end:
                  type: string
                  format: date-time
                step:
                  type: string
                  description: Step duration (e.g., "30s", "5m")
      responses:
        "200":
          description: Range query result
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Bad request
