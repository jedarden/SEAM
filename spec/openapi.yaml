openapi: 3.1.0
info:
  title: SEAM API
  version: 0.1.0
  description: |
    SEAM (Self-documenting Endpoint Access Mediator) is a unified gateway that proxies
    authenticated service requests while injecting required secrets. This spec describes
    the Phase 1a control-plane endpoints.

    **Phase 1a scope:** Gateway scaffold with hand-written whole spec (no fragment merge yet).
    Control-plane endpoints are reserved and short-circuit route-table lookup.
  contact:
    name: SEAM Project
    url: https://github.com/ardenone/seam
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

# servers will be populated at runtime with the caller-facing base URL
servers: []

# Error response schemas - reusable components for all error responses
components:
  schemas:
    # Standard error response format
    ErrorResponse:
      type: object
      description: Standard error response format for all API errors
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Machine-readable error code identifier
          enum:
            - bad_request
            - unauthorized
            - forbidden
            - not_found
            - method_not_allowed
            - invalid_version_parameter
            - missing_required_parameter
            - invalid_payload
            - route_not_found
            - validation_error
            - quota_exceeded
            - rate_limit_exceeded
            - internal_server_error
            - bad_gateway
            - service_unavailable
            - gateway_timeout
            - upstream_failed
            - capture_failed
            - spec_load_failed
            - config_error
        message:
          type: string
          description: Human-readable error description
        details:
          type: object
          description: Additional error context and metadata
          additionalProperties: true
        docs_url:
          type: string
          description: Link to relevant documentation
          format: uri
        request_id:
          type: string
          description: Unique request identifier for tracing
      example:
        error: route_not_found
        message: No route found for GET /unknown/path
        details:
          method: GET
          path: /unknown/path
        docs_url: /docs
        request_id: req_123456

    # Validation error response format
    ValidationErrorResponse:
      type: object
      description: Detailed validation error response with field-level errors
      required:
        - error
        - message
        - errors
      properties:
        error:
          type: string
          enum: [validation_error]
          description: Error code for validation failures
        message:
          type: string
          description: Human-readable validation error summary
        errors:
          type: array
          description: Array of field-level validation errors
          items:
            $ref: '#/components/schemas/ValidationError'
      example:
        error: validation_error
        message: Request validation failed
        errors:
          - field: version
            expected: _unversioned
            actual: v1
            docs_url: /docs/route?path=/openapi.json&method=GET&version=_unversioned

    # Individual field validation error
    ValidationError:
      type: object
      description: Field-level validation error
      required:
        - field
        - expected
      properties:
        field:
          type: string
          description: Field or parameter name that failed validation
        expected:
          type: string
          description: Expected value or format for the field
        actual:
          type: string
          description: Actual value received (optional)
        docs_url:
          type: string
          description: Link to documentation for this field
          format: uri

  # Reusable response templates
  responses:
    BadRequest:
      description: Bad Request - Invalid request parameters or payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: bad_request
            message: Invalid request parameters
            details:
              parameter: version

    Unauthorized:
      description: Unauthorized - Authentication required or failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: unauthorized
            message: Authentication required

    Forbidden:
      description: Forbidden - Insufficient permissions to access this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: forbidden
            message: Insufficient permissions

    NotFound:
      description: Not Found - Resource or route does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: route_not_found
            message: No route found for GET /unknown/path
            docs_url: /docs

    MethodNotAllowed:
      description: Method Not Allowed - HTTP method not supported for this endpoint
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: method_not_allowed
            message: Method not allowed

    TooManyRequests:
      description: Too Many Requests - Rate limit or quota exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: quota_exceeded
            message: Request quota exceeded

    InternalServerError:
      description: Internal Server Error - Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: internal_server_error
            message: An unexpected error occurred

    BadGateway:
      description: Bad Gateway - Upstream service error or unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: bad_gateway
            message: Upstream request failed

    ServiceUnavailable:
      description: Service Unavailable - Service temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: service_unavailable
            message: Service temporarily unavailable

paths:
  /openapi.json:
    get:
      summary: Get OpenAPI spec
      description: Returns the complete OpenAPI 3.1 specification for SEAM
      operationId: getOpenapiSpec
      tags:
        - Documentation
      responses:
        '200':
          description: OpenAPI 3.1 spec JSON
          content:
            application/json:
              schema:
                type: object
          headers:
            X-SEAM-Spec-Version:
              description: Stable hash of the served spec (changes only when spec content changes)
              schema:
                type: string
            X-SEAM-API-Version:
              description: API version (constant at _unversioned until Phase 8)
              schema:
                type: string
                default: _unversioned
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /docs:
    get:
      summary: API documentation
      description: Returns rendered API documentation (HTML or JSON)
      operationId: getDocs
      tags:
        - Documentation
      responses:
        '200':
          description: API documentation
          content:
            application/json:
              schema:
                type: object
            text/html:
              schema:
                type: string
          headers:
            X-SEAM-Spec-Version:
              description: Stable hash of the served spec
              schema:
                type: string
            X-SEAM-API-Version:
              description: API version
              schema:
                type: string
                default: _unversioned
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /docs/route:
    get:
      summary: Get documentation for one route
      description: |
        Returns the served OpenAPI slice for the path template in `path`.
        Omit `method` to receive every operation declared on that path. The
        route selector is a query parameter so encoded slashes in templates
        remain normalization-safe through the caller-facing stack.
      operationId: getRouteDocs
      tags:
        - Documentation
      parameters:
        - name: path
          in: query
          required: true
          description: OpenAPI path template, such as /widgets/{id}
          schema:
            type: string
          example: /openapi.json
        - name: method
          in: query
          required: false
          description: HTTP method to select; omit for every method on the path
          schema:
            type: string
            enum: [GET, PUT, POST, DELETE, PATCH, OPTIONS, HEAD, TRACE]
          example: GET
        - name: version
          in: query
          required: false
          description: Served API contract version (the only Phase 1a contract)
          schema:
            type: string
            enum: [_unversioned]
            default: _unversioned
      responses:
        '200':
          description: Route parameters, schemas, annotations, and worked example
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /_seam/healthz:
    get:
      summary: Liveness probe
      description: |
        Kubernetes liveness endpoint. Always returns 200 OK when the server is running.
        This is a minimal health check that confirms the HTTP server is responsive.
      operationId: healthz
      tags:
        - Health
      externalDocs:
        description: Kubernetes probe documentation
        url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
      responses:
        '200':
          description: Server is live
          content:
            text/plain:
              schema:
                type: string
                enum: ["OK"]
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /_seam/readyz:
    get:
      summary: Readiness probe
      description: |
        Kubernetes readiness endpoint. In Phase 1a, always returns ready=true.
        Phase 6a will add login dependency gating.
      operationId: readyz
      tags:
        - Health
      responses:
        '200':
          description: Server is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    type: boolean
                required: [ready]
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /_seam/metrics:
    get:
      summary: Prometheus metrics
      description: |
        Prometheus-style metrics endpoint. In Phase 1a, exposes Go runtime/build basics.
        Phase 8 will add per-route-version series.
      operationId: metrics
      tags:
        - Metrics
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /config/status:
    get:
      summary: Configuration status
      description: |
        Returns configuration fragment status. In Phase 1a, returns a quiescent/empty payload.
        Phase 1b will populate it with fragment quarantine status.
      operationId: configStatus
      tags:
        - Configuration
      responses:
        '200':
          description: Configuration status
          content:
            application/json:
              schema:
                type: object
                properties:
                  fragments_loaded:
                    type: boolean
                    description: Whether route fragments are loaded (false in Phase 1a)
                  conditions:
                    type: array
                    items:
                      type: string
                    description: Array of condition messages (empty in Phase 1a)
                required: [fragments_loaded, conditions]
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

tags:
  - name: Documentation
    description: API documentation and specification endpoints
  - name: Health
    description: Health check endpoints for Kubernetes probes
  - name: Metrics
    description: Metrics and monitoring endpoints
  - name: Configuration
    description: Configuration and fragment status endpoints
