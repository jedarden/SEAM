# Example 3: Route with Credential Probing
# This fragment demonstrates credential health monitoring with active probing
# Use case: Service where credentials may expire or become invalid

x-seam-schema: v1
x-seam-owner: external-api
x-api-version: v1
x-upstream: https://api.external-provider.com
x-vault-path: seam/routes/external-api/provider-token
x-inject-as:
  kind: bearer
x-credential-probe:
  path: /v1/accounts/whoami
  method: GET
  interval: 10m
x-breaker:
  threshold: 5
  openSeconds: 60
  enabled: true
x-required-scope: external-api:access

openapi: 3.1.0
info:
  title: External API with Credential Probing
  version: 1.0.0
  description: Proxy to external API with automatic credential health monitoring

paths:
  /external/v1/accounts:
    get:
      summary: List accounts
      operationId: listAccounts
      responses:
        '200':
          description: Accounts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        status:
                          type: string
        '401':
          description: Token expired or invalid (credential probe will detect this)
        '503':
          description: Circuit breaker open after repeated credential failures

  /external/v1/accounts/{accountId}:
    get:
      summary: Get account details
      operationId: getAccount
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account details retrieved
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Account not found
        '401':
          description: Authentication failed

  /external/v1/data:
    post:
      summary: Submit data to external service
      operationId: submitData
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data_type:
                  type: string
                payload:
                  type: object
              required:
                - data_type
                - payload
      responses:
        '202':
          description: Data accepted for processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  status:
                    type: string
                    enum: [accepted, processing]
        '400':
          description: Invalid request
        '401':
          description: Authentication failed

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
