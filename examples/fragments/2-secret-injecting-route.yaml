# Example 2: Simple Secret-Injecting Route
# This fragment demonstrates basic secret injection from OpenBao
# Use case: Forwarding requests to an upstream service that needs authentication

x-seam-schema: v1
x-seam-owner: weather-service
x-api-version: v1
x-upstream: https://weather-backend.ardenone.internal
x-vault-path: seam/routes/weather-service/api-key
x-inject-as:
  kind: header
  name: X-API-Key
x-credential-probe:
  path: /health
  method: GET
  interval: 5m
x-breaker:
  threshold: 10
  openSeconds: 30
  maxOpenSeconds: 300
x-required-scope: weather:query

openapi: 3.1.0
info:
  title: Weather Service Secret Injection
  version: 1.0.0
  description: Weather data API with automatic API key injection from OpenBao

paths:
  /weather/current:
    get:
      summary: Get current weather for a location
      operationId: getCurrentWeather
      parameters:
        - name: location
          in: query
          required: true
          schema:
            type: string
          description: Location name or coordinates
        - name: units
          in: query
          required: false
          schema:
            type: string
            enum: [metric, imperial]
            default: metric
      responses:
        '200':
          description: Weather data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  location:
                    type: string
                  temperature:
                    type: number
                  conditions:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid request parameters
        '401':
          description: Upstream authentication failed
        '503':
          description: Service unavailable - circuit breaker open
      x-loop-guard:
        max_iterations: 3
        backoff_ms: 100

  /weather/forecast:
    get:
      summary: Get weather forecast
      operationId: getForecast
      parameters:
        - name: location
          in: query
          required: true
          schema:
            type: string
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 7
            default: 5
      responses:
        '200':
          description: Forecast data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  location:
                    type: string
                  period_days:
                    type: integer
                  forecasts:
                    type: array
                    items:
                      type: object
        '400':
          description: Invalid request parameters
        '503':
          description: Service unavailable - circuit breaker open

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
