---
# RBAC for seam-retirement-evaluator
# Phase 8.5: Minimal permissions - only needs to read its own SA token for OpenBao auth
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seam-retirement-evaluator
  namespace: seam
  labels:
    app.kubernetes.io/name: seam-retirement-evaluator
    app.kubernetes.io/component: evaluator
rules:
  # Allow reading service account token for OpenBao auth
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["seam-retirement-evaluator-github-token"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seam-retirement-evaluator
  namespace: seam
  labels:
    app.kubernetes.io/name: seam-retirement-evaluator
    app.kubernetes.io/component: evaluator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: seam-retirement-evaluator
subjects:
  - kind: ServiceAccount
    name: seam-retirement-evaluator
    namespace: seam
