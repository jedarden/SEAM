---
# ServiceAccount for seam-retirement-evaluator
# Phase 8.5: Dedicated SA with OpenBao role for GitHub token access
# Explicitly isolated from seam/routes/* to prevent SEAM from reading evaluator's token
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seam-retirement-evaluator
  namespace: seam
  labels:
    app.kubernetes.io/name: seam-retirement-evaluator
    app.kubernetes.io/component: evaluator
    app.kubernetes.io/part-of: seam
    app.kubernetes.io/managed-by: argocd
