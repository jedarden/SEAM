# z.ai/GLM Proxy Route Fragment
# Phase 4: End-to-end credential injection proof
# Public upstream with metered quota-unit API
x-seam-schema: v1
x-seam-owner: zai
x-api-version: v1
x-upstream: https://api.z.ai
x-vault-path: seam/routes/zai/api-key
x-inject-as:
  kind: bearer
x-credential-probe:
  path: /v1/models
  method: GET
  interval: 10m

openapi: 3.1.0
info:
  title: z.ai GLM API Proxy
  version: 1.0.0
  description: |
    Proxy to z.ai's General Language Model (GLM) API with server-side credential injection.

    This route injects the z.ai API key from OpenBao (seam/routes/zai/api-key) as
    an Authorization Bearer token on every upstream request. Callers do not see
    the credential; it is injected server-side and scrubbed from responses.

    The upstream is metered in quota units per call. SEAM enforces per-caller quotas
    and costs to prevent runaway spend. A credential probe validates the secret every
    10 minutes against the /v1/models endpoint.

paths:
  /zai/v1/chat/completions:
    post:
      summary: Create chat completion
      operationId: createChatCompletion
      tags:
        - Chat
      x-cost-per-call:
        amount: 100
        unit: quota
      x-quota:
        amount: 10000
        unit: quota
        window: 1h
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - messages
              properties:
                model:
                  type: string
                  description: Model identifier (e.g., "glm-4", "glm-3-turbo")
                  enum:
                    - glm-4
                    - glm-3-turbo
                    - glm-3
                messages:
                  type: array
                  description: Array of message objects
                  items:
                    type: object
                    required:
                      - role
                      - content
                    properties:
                      role:
                        type: string
                        enum:
                          - system
                          - user
                          - assistant
                      content:
                        type: string
                temperature:
                  type: number
                  minimum: 0
                  maximum: 2
                  default: 1
                  description: Sampling temperature
                max_tokens:
                  type: integer
                  minimum: 1
                  default: 1024
                  description: Maximum tokens to generate
      responses:
        "200":
          description: Successful chat completion
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  object:
                    type: string
                  created:
                    type: integer
                  model:
                    type: string
                  choices:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                        message:
                          type: object
                        finish_reason:
                          type: string
                  usage:
                    type: object
                    properties:
                      prompt_tokens:
                        type: integer
                      completion_tokens:
                        type: integer
                      total_tokens:
                        type: integer
        "400":
          description: Invalid request
        "401":
          description: Invalid API key
        "429":
          description: Rate limit exceeded or loop detected
        "402":
          description: Quota exceeded

  /zai/v1/models:
    get:
      summary: List available models
      operationId: listModels
      tags:
        - Models
      x-cost-per-call:
        amount: 1
        unit: quota
      x-quota:
        amount: 1000
        unit: quota
        window: 1h
      responses:
        "200":
          description: List of available models
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        object:
                          type: string
                        owned_by:
                          type: string
        "401":
          description: Invalid API key

  /zai/v1/completions:
    post:
      summary: Create text completion
      operationId: createCompletion
      tags:
        - Completions
      x-cost-per-call:
        amount: 50
        unit: quota
      x-quota:
        amount: 10000
        unit: quota
        window: 1h
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - prompt
              properties:
                model:
                  type: string
                  description: Model identifier
                prompt:
                  type: string
                  description: The prompt to generate completions for
                max_tokens:
                  type: integer
                  minimum: 1
                  default: 256
                temperature:
                  type: number
                  minimum: 0
                  maximum: 2
                  default: 1
      responses:
        "200":
          description: Successful completion
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  object:
                    type: string
                  created:
                    type: integer
                  model:
                    type: string
                  choices:
                    type: array
                  usage:
                    type: object
        "400":
          description: Invalid request
        "401":
          description: Invalid API key
        "429":
          description: Rate limit exceeded or loop detected
        "402":
          description: Quota exceeded

  /zai/v1/embeddings:
    post:
      summary: Create embeddings
      operationId: createEmbeddings
      tags:
        - Embeddings
      x-cost-per-call:
        amount: 10
        unit: quota
      x-quota:
        amount: 5000
        unit: quota
        window: 1h
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - input
              properties:
                model:
                  type: string
                  description: Embedding model identifier
                input:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  description: Input text(s) to embed
      responses:
        "200":
          description: Successful embedding
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        embedding:
                          type: array
                          items:
                            type: number
                        index:
                          type: integer
                  model:
                    type: string
                  usage:
                    type: object
        "400":
          description: Invalid request
        "401":
          description: Invalid API key
        "429":
          description: Rate limit exceeded or loop detected
        "402":
          description: Quota exceeded
