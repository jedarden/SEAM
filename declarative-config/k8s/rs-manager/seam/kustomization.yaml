---
# Kustomization for SEAM Gateway deployment
# Phase 6a: Hosting foundation with Kubernetes auth to OpenBao
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Resources to deploy
# Note: namespace.yaml is excluded as the namespace is already managed by
# seam-retirement-evaluator-ns-rs-manager. Both applications share the seam namespace.
resources:
  - configmap-upstream-ca.yaml
  - configmap-allowlist.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml

# ConfigMap generators (disableNameSuffixHash for name stability)
configMapGenerator:
  - name: seam-routes-seam
    options:
      disableNameSuffixHash: true
    files:
      # Fragment schema for validation
      - fragment-schema.json
  - name: seam-routes-argocd
    options:
      disableNameSuffixHash: true
    files:
      # ArgoCD read-only proxy route fragment
      - routes/argocd-ro/argocd-read-only-proxy.yaml
  - name: seam-routes-zai
    options:
      disableNameSuffixHash: true
    files:
      # z.ai/GLM proxy route fragment (Phase 4)
      - routes/zai/zai-glm-proxy.yaml
  - name: seam-routes-twitterapi
    options:
      disableNameSuffixHash: true
    files:
      # twitterapi.io proxy route fragment (Phase 4)
      - routes/twitterapi/twitterapi-proxy.yaml
  - name: seam-routes-k8s
    options:
      disableNameSuffixHash: true
    files:
      # Kubernetes API multi-cluster proxy route fragment (Phase 5.2)
      - routes/k8s/k8s-api-proxy.yaml

# Labels to apply to all resources
commonLabels:
  app.kubernetes.io/name: seam
  app.kubernetes.io/component: gateway
  app.kubernetes.io/managed-by: argocd
