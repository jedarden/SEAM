---
# SEAM Gateway ServiceAccount
# Provides identity for Kubernetes authentication to OpenBao (Phase 6a)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seam
  namespace: seam
  labels:
    app.kubernetes.io/name: seam
    app.kubernetes.io/component: gateway
---
# Role for lease coordination (Phase 12 consumer)
# Allows SEAM to manage coordination.k8s.io leases for leader election
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seam-lease
  namespace: seam
  labels:
    app.kubernetes.io/name: seam
    app.kubernetes.io/component: gateway
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - create
  - update
---
# RoleBinding binds the lease role to the SEAM service account
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seam-lease
  namespace: seam
  labels:
    app.kubernetes.io/name: seam
    app.kubernetes.io/component: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: seam-lease
subjects:
- kind: ServiceAccount
  name: seam
  namespace: seam
