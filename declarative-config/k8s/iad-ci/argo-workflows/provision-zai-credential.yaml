---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: provision-zai-credential
  namespace: argo-workflows
  labels:
    app: seam
    component: zai-credential-provisioning
    phase: "4"
spec:
  entrypoint: provision-zai-secret
  arguments:
    parameters:
    - name: api-key
      value: ""  # Must be provided at submission time
    - name: dry-run
      value: "false"

  templates:
  - name: provision-zai-secret
    inputs:
      parameters:
      - name: api-key
      - name: dry-run
    container:
      image: openbao/openbao:2.6.1
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -e
          log() { echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] $1"; }
          error() { echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] ERROR: $1" >&2; exit 1; }

          # Configure OpenBao address
          OPENBAO_ADDR="http://openbao.external-secrets.svc.cluster.local:8200"
          export VAULT_ADDR=$OPENBAO_ADDR

          API_KEY="{{inputs.parameters.api-key}}"
          DRY_RUN="{{inputs.parameters.dry-run}}"

          log "=== z.ai/GLM Credential Provisioning (Phase 4) ==="
          log "Dry Run: $DRY_RUN"

          if [ -z "$API_KEY" ] && [ "$DRY_RUN" != "true" ]; then
            error "api-key parameter must be provided (use dry-run=true for testing)"
          fi

          # Check if we can reach OpenBao
          log "Testing connectivity to OpenBao at $OPENBAO_ADDR..."
          if ! vault status >/dev/null 2>&1; then
            error "Cannot reach OpenBao at $OPENBAO_ADDR"
          fi
          log "✓ OpenBao is reachable"

          # Read Kubernetes service account token for authentication
          if [ ! -f "/var/run/secrets/kubernetes.io/serviceaccount/token" ]; then
            error "Not running in Kubernetes cluster"
          fi

          SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          SA_NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
          SA_NAME=$(cat /var/run/secrets/kubernetes.io/serviceaccount/name)

          log "Running as ServiceAccount: $SA_NAME in namespace: $SA_NS"

          # Authenticate using Kubernetes auth method
          log "Authenticating to OpenBao via Kubernetes auth..."
          AUTH_RESPONSE=$(bao write -field=client_token auth/kubernetes/login role=argo-workflow jwt="$SA_TOKEN" 2>&1)

          if [ $? -ne 0 ] || [ -z "$AUTH_RESPONSE" ]; then
            error "Failed to authenticate via Kubernetes auth: $AUTH_RESPONSE"
          fi

          export VAULT_TOKEN=$AUTH_RESPONSE
          log "✓ Successfully authenticated to OpenBao (token: ${VAULT_TOKEN:0:12}...)"

          SECRET_PATH="secret/data/seam/routes/zai/api-key"

          log "=== Creating z.ai API Key Secret ==="
          log "Path: $SECRET_PATH"

          if [ "$DRY_RUN" = "true" ]; then
            log "DRY RUN: Would create secret at $SECRET_PATH"
            log "DRY RUN: Secret would contain: api_key"
          else
            # Create secret with the API key
            WRITE_RESPONSE=$(bao kv put "$SECRET_PATH" \
              api_key="$API_KEY" \
              created_by=provision-zai-credential-workflow \
              created_on=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
              namespace=$SA_NS \
              service_account=$SA_NAME \
              description="z.ai/GLM API credential for SEAM Phase 4 injection proof" 2>&1)

            if [ $? -ne 0 ]; then
              error "Failed to create secret: $WRITE_RESPONSE"
            fi

            log "✓ Successfully created z.ai credential at: $SECRET_PATH"

            # Verify creation
            log "Verifying secret creation..."
            if bao kv get "$SECRET_PATH" >/dev/null 2>&1; then
              log "✓ Secret creation verified"

              # Verify the secret contains the api_key field
              if bao kv get -field=api_key "$SECRET_PATH" >/dev/null 2>&1; then
                log "✓ API key field verified"
              else
                error "API key field verification failed"
              fi
            else
              error "Secret creation verification failed"
            fi
          fi

          # Summary
          log "=== Provisioning Complete ==="
          log "Secret Path: secret/data/seam/routes/zai/api-key"
          log "Status: Success"
          log "Dry Run: $DRY_RUN"
          log ""
          log "Next steps for end-to-end injection proof:"
          log "1. Deploy SEAM with the z.ai fragment (declarative-config/k8s/rs-manager/seam)"
          log "2. Test injection: curl -X POST https://seam-rs-manager.tail1b1987.ts.net:8444/zai/v1/chat/completions ..."
          log "3. Verify the upstream request contains the injected Authorization header"
          log "4. Verify responses are scrubbed (no credential leaked)"

    serviceAccountName: argo-workflow
    retryStrategy:
      limit: 2
