---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: seam-retirement-evaluator-openbao-setup
  namespace: argo-workflows
  labels:
    app: seam-retirement-evaluator
    component: openbao-provisioning
spec:
  entrypoint: setup-openbao-resources
  templates:
  - name: setup-openbao-resources
    inputs:
      parameters:
      - name: github-token
        value: ""
    container:
      image: ghcr.io/openbao/openbao:1.15.0
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -e
          log() { echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] $1"; }
          error() { echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] ERROR: $1" >&2; exit 1; }

          OPENBAO_ADDR="http://openbao.external-secrets.svc.cluster.local:8200"
          export VAULT_ADDR=$OPENBAO_ADDR

          log "Starting OpenBao setup for seam-retirement-evaluator..."

          # Check if we can reach OpenBao
          if ! bao status >/dev/null 2>&1; then
            error "Cannot reach OpenBao at $OPENBAO_ADDR"
          fi

          log "OpenBao is reachable, proceeding with setup..."

          # Step 1: Load the evaluator policy
          log "Loading seam-retirement-evaluator policy..."
          bao policy write seam-retirement-evaluator-policy - <<'EOF'
          # OpenBao HCL policy for seam-retirement-evaluator
          # Allows read access to evaluator's own GitHub token path and VictoriaMetrics credentials
          # Explicitly denies access to seam/routes/* to ensure SEAM cannot read evaluator's token

          # Allow reading evaluator's own GitHub token
          path "secret/data/seam-retirement-evaluator/*" {
            capabilities = ["read"]
          }

          # Allow reading VictoriaMetrics credentials (for metrics query access)
          path "secret/data/monitoring/victoriametrics/*" {
            capabilities = ["read"]
          }

          # Explicitly deny access to SEAM's route secrets
          path "secret/data/seam/routes/*" {
            capabilities = ["deny"]
          }

          # Deny access to all other secrets
          path "secret/data/*" {
            capabilities = ["deny"]
          }
          EOF

          log "Policy loaded successfully"

          # Step 2: Configure Kubernetes auth role
          log "Configuring Kubernetes auth role for seam-retirement-evaluator..."
          bao write auth/kubernetes/role/seam-retirement-evaluator \
            bound_service_account_names=seam-retirement-evaluator \
            bound_service_account_namespaces=seam \
            policies=seam-retirement-evaluator-policy \
            token_ttl=24h \
            token_max_ttl=72h \
            token_default_policies=seam-retirement-evaluator-policy

          log "Kubernetes auth role configured"

          # Step 3: Create the GitHub token path
          GITHUB_TOKEN="{{inputs.parameters.github-token}}"
          if [ -n "$GITHUB_TOKEN" ]; then
            log "Creating GitHub token with provided value..."
            bao kv put secret/seam-retirement-evaluator/github-token \
              token="$GITHUB_TOKEN" \
              created_by="seam-retirement-evaluator-setup-workflow" \
              created_on=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          else
            log "Creating GitHub token placeholder (no token provided)..."
            bao kv put secret/seam-retirement-evaluator/github-token \
              token="REPLACE_WITH_ACTUAL_GITHUB_PAT" \
              note="This is a placeholder. Replace with actual GitHub PAT from https://github.com/settings/tokens with repo scope" \
              created_by="seam-retirement-evaluator-setup-workflow" \
              created_on=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          fi

          log "GitHub token path created"

          # Step 4: Verify SEAM policy doesn't have access to evaluator path
          log "Verifying SEAM policy isolation..."
          if bao policy read seam-openbao-policy 2>/dev/null | grep -q "seam-retirement-evaluator"; then
            error "SEAM policy may have access to evaluator paths - this is a security issue!"
          else
            log "SEAM policy correctly isolated from evaluator paths"
          fi

          # Step 5: Create VictoriaMetrics credentials placeholder (if not exists)
          log "Setting up VictoriaMetrics credentials path..."
          if ! bao kv get secret/monitoring/victoriametrics/readonly-credentials >/dev/null 2>&1; then
            bao kv put secret/monitoring/victoriametrics/readonly-credentials \
              username="" \
              password="" \
              endpoint="http://victorialogs-single-ardenone-manager-vector-headless.monitoring.svc.cluster.local:8428" \
              note="Read-only VictoriaMetrics credentials for seam-retirement-evaluator. VictoriaMetrics on this cluster uses internal auth and no external credentials needed for read-only query access." \
              created_by="seam-retirement-evaluator-setup-workflow"
            log "VictoriaMetrics credentials placeholder created"
          else
            log "VictoriaMetrics credentials already exist"
          fi

          log "=== OpenBao setup complete ==="
          log "Next steps:"
          log "1. If token was not provided, create GitHub PAT at https://github.com/settings/tokens"
          log "2. Update the token: bao kv put secret/seam-retirement-evaluator/github-token token=ghp_..."
          log "3. Run verification workflow to test access"
    serviceAccountName: argo-workflow
    retryStrategy:
      limit: 3
