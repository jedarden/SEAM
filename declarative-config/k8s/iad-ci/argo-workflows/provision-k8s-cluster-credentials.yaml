---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: provision-k8s-cluster-credentials
  namespace: argo-workflows
  labels:
    app: seam
    component: k8s-credential-provisioning
    phase: "5.2"
spec:
  entrypoint: provision-all-cluster-secrets
  arguments:
    parameters:
    - name: ardenone-cluster-token
      value: ""  # Observer SA token from ~/.kube/ardenone-cluster-observer.kubeconfig
    - name: apexalgo-iad-token
      value: ""  # Observer SA token
    - name: ardenone-manager-observer-token
      value: ""  # Observer SA token from ~/.kube/ardenone-manager-observer.kubeconfig
    - name: rs-manager-observer-token
      value: ""  # Observer SA token from ~/.kube/rs-manager-observer.kubeconfig
    - name: iad-ci-observer-token
      value: ""  # Observer SA token from ~/.kube/iad-ci.kubeconfig (read-only proxy)
    - name: iad-kalshi-observer-token
      value: ""  # Observer SA token
    - name: ord-devimprint-observer-token
      value: ""  # Observer SA token from ~/.kube/ord-devimprint-observer.kubeconfig
    - name: iad-options-observer-token
      value: ""  # Observer SA token from ~/.kube/iad-options-observer.kubeconfig
    - name: rs-manager-admin-token
      value: ""  # Admin OIDC token from ~/.kube/rs-manager.kubeconfig (~3 day expiry)
    - name: dry-run
      value: "false"

  templates:
  - name: provision-all-cluster-secrets
    inputs:
      parameters:
      - name: ardenone-cluster-token
      - name: apexalgo-iad-token
      - name: ardenone-manager-observer-token
      - name: rs-manager-observer-token
      - name: iad-ci-observer-token
      - name: iad-kalshi-observer-token
      - name: ord-devimprint-observer-token
      - name: iad-options-observer-token
      - name: rs-manager-admin-token
      - name: dry-run
    steps:
    - - name: provision-ardenone-cluster-observer
        template: provision-cluster-secret
        arguments:
          parameters:
          - name: cluster-name
            value: "ardenone-cluster"
          - name: access-type
            value: "observer"
          - name: token
            value: "{{inputs.parameters.ardenone-cluster-token}}"
          - name: dry-run
            value: "{{inputs.parameters.dry-run}}"
    - - name: provision-apexalgo-iad-observer
        template: provision-cluster-secret
        arguments:
          parameters:
          - name: cluster-name
            value: "apexalgo-iad"
          - name: access-type
            value: "observer"
          - name: token
            value: "{{inputs.parameters.apexalgo-iad-token}}"
          - name: dry-run
            value: "{{inputs.parameters.dry-run}}"
    - - name: provision-ardenone-manager-observer
        template: provision-cluster-secret
        arguments:
          parameters:
          - name: cluster-name
            value: "ardenone-manager"
          - name: access-type
            value: "observer"
          - name: token
            value: "{{inputs.parameters.ardenone-manager-observer-token}}"
          - name: dry-run
            value: "{{inputs.parameters.dry-run}}"
    - - name: provision-rs-manager-observer
        template: provision-cluster-secret
        arguments:
          parameters:
          - name: cluster-name
            value: "rs-manager"
          - name: access-type
            value: "observer"
          - name: token
            value: "{{inputs.parameters.rs-manager-observer-token}}"
          - name: dry-run
            value: "{{inputs.parameters.dry-run}}"
    - - name: provision-iad-ci-observer
        template: provision-cluster-secret
        arguments:
          parameters:
          - name: cluster-name
            value: "iad-ci"
          - name: access-type
            value: "observer"
          - name: token
            value: "{{inputs.parameters.iad-ci-observer-token}}"
          - name: dry-run
            value: "{{inputs.parameters.dry-run}}"
    - - name: provision-iad-kalshi-observer
        template: provision-cluster-secret
        arguments:
          parameters:
          - name: cluster-name
            value: "iad-kalshi"
          - name: access-type
            value: "observer"
          - name: token
            value: "{{inputs.parameters.iad-kalshi-observer-token}}"
          - name: dry-run
            value: "{{inputs.parameters.dry-run}}"
    - - name: provision-ord-devimprint-observer
        template: provision-cluster-secret
        arguments:
          parameters:
          - name: cluster-name
            value: "ord-devimprint"
          - name: access-type
            value: "observer"
          - name: token
            value: "{{inputs.parameters.ord-devimprint-observer-token}}"
          - name: dry-run
            value: "{{inputs.parameters.dry-run}}"
    - - name: provision-iad-options-observer
        template: provision-cluster-secret
        arguments:
          parameters:
          - name: cluster-name
            value: "iad-options"
          - name: access-type
            value: "observer"
          - name: token
            value: "{{inputs.parameters.iad-options-observer-token}}"
          - name: dry-run
            value: "{{inputs.parameters.dry-run}}"
    - - name: provision-rs-manager-admin
        template: provision-cluster-secret
        arguments:
          parameters:
          - name: cluster-name
            value: "rs-manager"
          - name: access-type
            value: "admin"
          - name: token
            value: "{{inputs.parameters.rs-manager-admin-token}}"
          - name: dry-run
            value: "{{inputs.parameters.dry-run}}"

  - name: provision-cluster-secret
    inputs:
      parameters:
      - name: cluster-name
      - name: access-type
      - name: token
      - name: dry-run
    container:
      image: openbao/openbao:2.6.1
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -e
          log() { echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] $1"; }
          error() { echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] ERROR: $1" >&2; exit 1; }

          # Configure OpenBao address
          OPENBAO_ADDR="http://openbao.external-secrets.svc.cluster.local:8200"
          export VAULT_ADDR=$OPENBAO_ADDR

          CLUSTER_NAME="{{inputs.parameters.cluster-name}}"
          ACCESS_TYPE="{{inputs.parameters.access-type}}"
          TOKEN="{{inputs.parameters.token}}"
          DRY_RUN="{{inputs.parameters.dry-run}}"

          log "=== Kubernetes Cluster Credential Provisioning (Phase 5.2) ==="
          log "Cluster: $CLUSTER_NAME"
          log "Access Type: $ACCESS_TYPE"
          log "Dry Run: $DRY_RUN"

          if [ -z "$TOKEN" ] && [ "$DRY_RUN" != "true" ]; then
            error "token parameter must be provided for $CLUSTER_NAME (use dry-run=true for testing)"
          fi

          # Check if we can reach OpenBao
          log "Testing connectivity to OpenBao at $OPENBAO_ADDR..."
          if ! vault status >/dev/null 2>&1; then
            error "Cannot reach OpenBao at $OPENBAO_ADDR"
          fi
          log "✓ OpenBao is reachable"

          # Read Kubernetes service account token for authentication
          if [ ! -f "/var/run/secrets/kubernetes.io/serviceaccount/token" ]; then
            error "Not running in Kubernetes cluster"
          fi

          SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          SA_NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
          SA_NAME=$(cat /var/run/secrets/kubernetes.io/serviceaccount/name)

          log "Running as ServiceAccount: $SA_NAME in namespace: $SA_NS"

          # Authenticate using Kubernetes auth method
          log "Authenticating to OpenBao via Kubernetes auth..."
          AUTH_RESPONSE=$(bao write -field=client_token auth/kubernetes/login role=argo-workflow jwt="$SA_TOKEN" 2>&1)

          if [ $? -ne 0 ] || [ -z "$AUTH_RESPONSE" ]; then
            error "Failed to authenticate via Kubernetes auth: $AUTH_RESPONSE"
          fi

          export VAULT_TOKEN=$AUTH_RESPONSE
          log "✓ Successfully authenticated to OpenBao (token: ${VAULT_TOKEN:0:12}...)"

          SECRET_PATH="secret/data/seam/routes/k8s/${CLUSTER_NAME}-${ACCESS_TYPE}-token"

          log "=== Creating Kubernetes Cluster Secret ==="
          log "Path: $SECRET_PATH"
          log "Access Type: $ACCESS_TYPE"

          if [ "$DRY_RUN" = "true" ]; then
            log "DRY RUN: Would create secret at $SECRET_PATH"
            log "DRY RUN: Secret would contain: token, cluster_name, access_type"
          else
            # Create secret with the token
            WRITE_RESPONSE=$(bao kv put "$SECRET_PATH" \
              token="$TOKEN" \
              cluster_name="$CLUSTER_NAME" \
              access_type="$ACCESS_TYPE" \
              created_by=provision-k8s-cluster-credentials-workflow \
              created_on=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
              namespace=$SA_NS \
              service_account=$SA_NAME \
              description="Kubernetes ${CLUSTER_NAME} ${ACCESS_type} credential for SEAM Phase 5.2 nine-cluster proxy" 2>&1)

            if [ $? -ne 0 ]; then
              error "Failed to create secret: $WRITE_RESPONSE"
            fi

            log "✓ Successfully created ${CLUSTER_NAME} ${ACCESS_TYPE} credential at: $SECRET_PATH"

            # Verify creation
            log "Verifying secret creation..."
            if bao kv get "$SECRET_PATH" >/dev/null 2>&1; then
              log "✓ Secret creation verified"

              # Verify the secret contains the token field
              if bao kv get -field=token "$SECRET_PATH" >/dev/null 2>&1; then
                log "✓ Token field verified"
              else
                error "Token field verification failed"
              fi
            else
              error "Secret creation verification failed"
            fi
          fi

          log "=== Provisioning Complete for ${CLUSTER_NAME} ==="
          log "Secret Path: secret/data/seam/routes/k8s/${CLUSTER_NAME}-${ACCESS_TYPE}-token"
          log "Status: Success"
          log "Dry Run: $DRY_RUN"

    serviceAccountName: argo-workflow
    retryStrategy:
      limit: 2
